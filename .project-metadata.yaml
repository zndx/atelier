name: Atelier
description: |
  Agentic classification workbench powered by the Claude Agent SDK
  with interactive embedding visualization and adaptive keystone-agent
  orchestration for Cloudera AI.
author: "Cloudera Inc."
date: "2026-04-05"
specification_version: 1.0
prototype_version: 0.1.0

environment_variables:
  ANTHROPIC_API_KEY:
    default: ""
    description: "Anthropic API key for Claude Agent SDK"
    required: false

runtimes:
  - editor: PBJ Workbench
    kernel: Python 3.12
    edition: Standard

tasks:
  - type: create_job
    name: Install Dependencies
    entity_label: install_deps
    script: scripts/install_deps.py
    arguments: None
    short_summary: Install Python packages, build React UI, download Qdrant binary.
    kernel: python3
    cpu: 2
    memory: 8
    environment:
      TASK_TYPE: CREATE/RUN_JOB

  - type: run_job
    entity_label: install_deps
    short_summary: Running install dependencies job.

  - type: start_application
    name: Atelier
    subdomain: atelier
    script: scripts/startup_app.py
    short_summary: Start Atelier gRPC service and web UI
    bypass_authentication: false
    cpu: 2
    memory: 4
    environment_variables:
      TASK_TYPE: START_APPLICATION
