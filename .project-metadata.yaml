name: Atelier
description: |
  Agentic classification workbench powered by the Claude Agent SDK
  with interactive embedding visualization and adaptive keystone-agent
  orchestration for Cloudera AI.
author: "Cloudera Inc."
date: "2026-04-05"
specification_version: 1.0
prototype_version: 0.5.1

environment_variables:
  # ══════════════════════════════════════════════════════════════════
  # REQUIRED — paste these four values, then start the Application.
  # Everything else is optional (defaults ship encrypted in
  # .env.cai.enc; SOPS_AGE_KEY unlocks them at boot).
  # ══════════════════════════════════════════════════════════════════

  AWS_ACCESS_KEY_ID:
    default: ""
    description: >-
      **Required.** AWS access key for Bedrock inference.
  AWS_SECRET_ACCESS_KEY:
    default: ""
    description: >-
      **Required.** AWS secret key for Bedrock inference.
  ANTHROPIC_API_KEY:
    default: ""
    description: >-
      **Required.** Direct Anthropic API key. Powers the overwatch
      supervisor (Bedrock cannot run overwatch; it classifies only).
      Can coexist with Bedrock credentials — both are validated at startup.
  SOPS_AGE_KEY:
    default: ""
    description: >-
      **Required.** Full `AGE-SECRET-KEY-1…` string provided by the
      Atelier maintainer out-of-band. Unlocks the encrypted deployment
      defaults in `.env.cai.enc` plus the ground-truth CSV fixture at
      startup. Alternative: set `SOPS_AGE_KEY_FILE` to a mounted path.
      Without this key, the four above are the only config the app sees.

  # ══════════════════════════════════════════════════════════════════
  # OPTIONAL — values below ship encrypted in `.env.cai.enc` and are
  # decrypted at boot when `SOPS_AGE_KEY` is present. Set an entry
  # here only to override the SOPS-decrypted default on this deploy.
  # ══════════════════════════════════════════════════════════════════

  # ── AWS / Bedrock region + session ─────────────────────────────
  AWS_REGION:
    default: "us-east-1"
    description: >-
      _Optional. SOPS-decrypted default ships in `.env.cai.enc`;
      override only for non-us-east-1 deploys._
      AWS region for Bedrock inference.
  AWS_SESSION_TOKEN:
    default: ""
    description: >-
      _Optional._ AWS session token for temporary credentials (STS
      AssumeRole). Leave blank when using permanent IAM credentials.

  # ── Agent SDK (Claude Code) ────────────────────────────────────
  ATELIER_AGENT_MODEL:
    default: ""
    description: >-
      Primary model for agentic orchestration. Plain Anthropic ID for direct
      API, Bedrock inference profile ARN for AWS. Example:
      arn:aws:bedrock:us-east-1:440464140575:inference-profile/us.anthropic.claude-opus-4-6-v1
  ANTHROPIC_DEFAULT_SONNET_MODEL:
    default: ""
    description: >-
      Bedrock model ID / ARN for Sonnet-sized internal dispatches. Required
      when using Bedrock; the Claude CLI's built-in default is a direct-API
      model name that does not resolve on Bedrock. Leave blank to fall back
      to ATELIER_AGENT_MODEL.
  ANTHROPIC_DEFAULT_HAIKU_MODEL:
    default: ""
    description: >-
      Bedrock model ID / ARN for Haiku-sized internal dispatches (tool
      search, summarization). Required when using Bedrock. Leave blank
      to fall back to ATELIER_AGENT_MODEL.
  CLAUDE_CODE_SUBAGENT_MODEL:
    default: ""
    description: >-
      Bedrock model ID / ARN for CLI subagent dispatch. Leave blank to fall
      back to ATELIER_AGENT_MODEL.
  CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS:
    default: ""
    description: >-
      Disable experimental CLI betas (e.g. tool search). Defaults to "1"
      on the Bedrock path since those betas dispatch to direct-API
      sub-models. Leave blank to accept the provider default.
  ENABLE_TOOL_SEARCH:
    default: ""
    description: >-
      Enable the CLI's tool-search beta. Defaults to "false" on the
      Bedrock path. Leave blank to accept the provider default.

  # ── Classification LLM ─────────────────────────────────────────
  ATELIER_CLASSIFY_MODEL:
    default: ""
    description: >-
      **Primary classification model setting.** Bedrock inference-profile
      ARN (preferred on CAI) or plain Anthropic model ID. Backend is
      inferred from the identifier format — arn:... or us.anthropic.*
      routes through Bedrock invoke_model; claude-sonnet-* / claude-opus-*
      uses the direct Messages API. Takes precedence over
      ANTHROPIC_SUBAGENT_MODEL when both are set.
      Example (Bedrock Opus 4.6): us.anthropic.claude-opus-4-6-v1:0
      Example (Bedrock Sonnet 4.5): us.anthropic.claude-sonnet-4-5-20250929-v1:0
      Example (direct API): claude-opus-4-7
  ANTHROPIC_SUBAGENT_MODEL:
    default: ""
    description: >-
      Legacy alias for ATELIER_CLASSIFY_MODEL. Kept so deployments
      provisioned before the rename continue to work. Prefer
      ATELIER_CLASSIFY_MODEL for new deployments — identical behavior,
      but groups with the other ATELIER_CLASSIFY_* controls in the AMP
      configuration page.
  ATELIER_LLM_BACKEND:
    default: ""
    description: >-
      Explicit LLM backend for classification. Overrides ANTHROPIC_SUBAGENT_MODEL.
      Values: "openai_compatible" (vLLM, LiteLLM, etc.), "cerebras",
      "anthropic", "bedrock". Requires ATELIER_LLM_API_KEY and/or
      ATELIER_LLM_BASE_URL. Leave blank to use ANTHROPIC_SUBAGENT_MODEL.
  ATELIER_LLM_API_KEY:
    default: ""
    description: >-
      API key for the explicit classification LLM backend. Required when
      ATELIER_LLM_BACKEND is set to "openai_compatible" or "cerebras".
  ATELIER_LLM_MODEL:
    default: ""
    description: >-
      Model name for the explicit classification LLM. Default depends on
      backend (e.g. "glm-4.7" for openai_compatible, "zai-glm-4.7" for
      cerebras). Only used with ATELIER_LLM_BACKEND.
  ATELIER_LLM_BASE_URL:
    default: ""
    description: >-
      Base URL for the explicit LLM backend. Essential for on-prem
      open-weights models served via vLLM, LiteLLM, or similar.
      Example: http://hgx-node:8000/v1
  ATELIER_LLM_COLUMNS_PER_CALL:
    default: "25"
    description: >-
      Number of columns to classify per LLM call. Higher values reduce
      API round-trips but risk response truncation when vocabulary
      exceeds ~200 terms (the LLM silently drops trailing columns from
      the JSON response as it nears max_tokens). 25 is the safe default
      for UAT-scale corpora. Reduce further only if LLM Coverage on the
      Status page lands below 95%.

  # ── Classification Pipeline ────────────────────────────────────
  ATELIER_CLASSIFY_CONNECTION:
    default: ""
    description: >-
      CAI Data Platform connection name for Hive metadata discovery. Must
      match a connection registered in the workspace Data Connections UI.
  ATELIER_CLASSIFY_DATABASE:
    default: "default"
    description: >-
      Hive database to classify. Tables are discovered via the connection
      specified in ATELIER_CLASSIFY_CONNECTION.
  ATELIER_CLASSIFY_SAMPLE_SIZE:
    default: "50"
    description: >-
      Number of sample values to retrieve per column for classification
      evidence. Higher values improve classification accuracy but increase
      memory usage and API payload size.
  ATELIER_CLASSIFY_COLUMN_SAMPLE_LIMIT:
    default: "1000"
    description: >-
      Row limit for COUNT(DISTINCT) cardinality queries per table. Higher
      values give more accurate cardinality but increase query time on
      large tables.
  ATELIER_CLASSIFY_TABLES_LIMIT:
    default: "100"
    description: >-
      Maximum number of tables to discover and classify per pipeline run.
      Set to 0 for unlimited. Useful for initial testing on large databases.
  ATELIER_CLASSIFY_AUTO_START:
    default: "false"
    description: >-
      Set to "true" to automatically start the classification pipeline when
      the gateway boots. Otherwise, start manually from the UI or API.

  # ── Bootstrap Convergence ──────────────────────────────────────
  ATELIER_BOOTSTRAP_MAX_ITERATIONS:
    default: "5"
    description: >-
      Maximum LLM-ML convergence iterations. Each iteration: LLM sweep,
      ML validation, targeted revisit of disagreements. Pipeline stops
      early when convergence criteria are met.
  ATELIER_BOOTSTRAP_K_THRESHOLD:
    default: "0.2"
    description: >-
      Mean Cohen's Kappa conflict threshold for convergence. Lower values
      require tighter LLM-ML agreement before stopping. Range: 0.0-1.0.
  ATELIER_BOOTSTRAP_COVERAGE_TARGET:
    default: "1.00"
    description: >-
      Fraction of columns that must have a predicted_code before the
      bootstrap loop considers itself converged. 1.00 (the default)
      forces the pipeline to keep iterating until every column has a
      label; lower values let partial coverage count as done. Range:
      0.0-1.0.
  ATELIER_BOOTSTRAP_CLARITY_TARGET:
    default: "0.25"
    description: >-
      Max fraction of columns flagged unclear (high gap or low belief)
      tolerated before the bootstrap loop accepts an iteration.
      Recalibrated 0.20 → 0.25 for the parent-aware DST frame: parent
      focal elements widen leaf Pl-Bel intervals, so the leaf-only-tuned
      0.20 caused convergence loops to grind through max_iterations for
      negligible accuracy gain. Range: 0.05-0.30.

  # ── Monte Carlo sampling ───────────────────────────────────────
  ATELIER_MC_SAMPLE_FRACTION:
    default: "1.00"
    description: >-
      Fraction of discovered columns sent to the LLM on the initial
      sweep. 1.00 (the default) disables Monte-Carlo stratification and
      sends every column to the LLM — the thesis-aligned mode where
      CatBoost then fine-tunes to agree with the LLM. Scale back only
      if LLM budget is the constraint. Range: 0.08-1.00.

  # ── CatBoost training ──────────────────────────────────────────
  ATELIER_CATBOOST_FIT_TO_LLM:
    default: "true"
    description: >-
      When true (the default), CatBoost is trained in-memory on the
      LLM's per-column labels after the sweep, then joins DST fusion
      with mass that agrees with the LLM by construction. SHAP / SAGE
      then attribute the LLM's decisions to the 12 embedding features —
      the explainability surface. Set "false" to fall back to the
      pre-trained CatBoost model on disk.

  # ── Ground truth (optional) ────────────────────────────────────
  ATELIER_GROUND_TRUTH_URI:
    default: ""
    description: >-
      Optional path (or file:// URI) to a CSV of expected labels used
      for accuracy reporting in evaluation_report.json and overwatch.
      Schema (either form):
        column_name,code[,annotation]            (qualified names)
        table_name,column_name,code[,annotation]
      The loader indexes keys in multiple forms so qualifier
      conventions don't matter. Leave blank to skip accuracy scoring.

  # ── Data Connections ───────────────────────────────────────────
  ATELIER_DATA_CONNECTIONS:
    default: ""
    description: >-
      Comma-separated list of CAI Data Platform connection names available
      in this workspace (as shown in the CAI Data Connections UI). The
      Atelier Status page exposes these in a dropdown for ad-hoc
      connectivity tests via cml.data_v1. Example:
      "default-impala,prod-hive,dev-virtual-warehouse"

runtimes:
  - editor: PBJ Workbench
    kernel: Python 3.12
    edition: Standard

tasks:
  - type: create_job
    name: Install Dependencies
    entity_label: install_deps
    script: scripts/install_deps.py
    arguments: None
    short_summary: Install Python packages, build React UI, download Qdrant binary.
    kernel: python3
    cpu: 2
    memory: 8
    environment:
      TASK_TYPE: CREATE/RUN_JOB

  - type: run_job
    entity_label: install_deps
    short_summary: Running install dependencies job.

  - type: start_application
    name: Atelier
    subdomain: atelier
    script: scripts/startup_app.py
    short_summary: Start Atelier gRPC service and web UI
    bypass_authentication: false
    cpu: 2
    memory: 4
    # Request one NVIDIA GPU so SAGE/SHAP, CatBoost training, and
    # sentence-transformer embedding all route through CUDA kernels
    # when available.  On A10G hosts (22 GB VRAM) this cuts full
    # pipeline wall time from ~20 min to ~4 min; on CPU hosts the
    # pipeline falls back automatically (preflight_gpu()).
    nvidia_gpu: 1
    environment_variables:
      TASK_TYPE: START_APPLICATION
