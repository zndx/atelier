[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atelier"
version = "0.5.1"
description = "Agentic classification workbench for Cloudera AI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.65.0",
    "grpcio-tools>=1.65.0",
    "protobuf>=5.27.0",
    "pyhocon>=0.3.61",
    "sqlalchemy>=2.0.0",
    "psycopg>=3.2.0",
    # macOS: bundle libpq via the binary wheel.  Linux gets libpq from
    # devenv's LD_LIBRARY_PATH (postgresql_16.lib); on darwin DYLD_* is
    # stripped by SIP across /bin/sh hops, so env-based injection is
    # unreliable — the self-contained wheel sidesteps it entirely.
    "psycopg[binary]>=3.2.0; sys_platform == 'darwin'",
    "uvicorn[standard]>=0.30.0",
    "fastapi>=0.115.0",
    "dspy>=3.1.3",
    "agentlightning[apo]>=0.3.0",
    # Agents
    "claude-agent-sdk>=0.1.0",
    "anthropic>=0.84.0",
    # LLM backends
    "openai>=1.0.0",
    "boto3>=1.34.0",
    # ML classifiers
    "catboost>=1.2.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    # Feature importance
    "sage-importance>=0.0.6",
    "shap>=0.42.0",
    # Embeddings + visualization
    "pyarrow>=18.0.0",
    "pandas>=2.2.0",
    "sentence-transformers>=3.0.0",
    "umap-learn>=0.5.0",
    # Vector store (late-interaction multi-vector cosine)
    "qdrant-client>=1.11.0",
    # Document ingestion
    "docling>=2.63.0",
    # CDP governance & discovery
    "cdpcurl>=1.0.0",
]

# CAI-WORKAROUND: cuml-cu12 + cupy-cuda12x are installed by
# scripts/install_deps.py via direct pip when nvidia-smi is present,
# NOT as a [gpu] extra here.  Reason: cuml-cu12's wheel-stub install
# mechanism (downloads the real wheel from pypi.nvidia.com gated on
# nvidia-smi at install time) cannot be modeled by uv's resolver,
# which assumes standard pip-discoverable wheels.  Any uv touch on
# pyproject.toml fails when these packages are listed here, on hosts
# without GPU — including the CAI Session pod where ad-hoc dev
# happens (no operator-controllable way to add GPU to that runtime
# even though the rest of the CAI environment has plenty available).
#
# When the CAI Session-pod runtime gains GPU access — or when cuml
# ships uv-resolvable wheels — restore as:
#     [project.optional-dependencies]
#     gpu = ["cuml-cu12>=24.10", "cupy-cuda12x>=13.0"]
# and revert scripts/install_deps.py's pip-direct block to:
#     extras.append("gpu")  # if GPU detected
# Tracked as a deferred architectural ideal — uv-native end-to-end.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
    "autopep8>=2.0.0",
    "behave>=1.2.6",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
# zndx: the shared signals-federation proto surface (zndx.engine.v1),
# generated from external/signals-protocol — every signals engine registers
# it beside its native service.
packages = ["src/atelier", "src/zndx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
