[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atelier"
version = "0.2.0"
description = "Agentic classification workbench for Cloudera AI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.65.0",
    "grpcio-tools>=1.65.0",
    "protobuf>=5.27.0",
    "pyhocon>=0.3.61",
    "sqlalchemy>=2.0.0",
    "psycopg>=3.2.0",
    "uvicorn[standard]>=0.30.0",
    "fastapi>=0.115.0",
    "dspy>=3.1.3",
    "agentlightning[apo]>=0.3.0",
    # Agents
    "claude-agent-sdk>=0.1.0",
    "anthropic>=0.84.0",
    # LLM backends
    "openai>=1.0.0",
    "boto3>=1.34.0",
    # ML classifiers
    "catboost>=1.2.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    # Feature importance
    "sage-importance>=0.0.6",
    "shap>=0.42.0",
    # Embeddings + visualization
    "pyarrow>=18.0.0",
    "pandas>=2.2.0",
    "sentence-transformers>=3.0.0",
    "umap-learn>=0.5.0",
    # Document ingestion
    "docling>=2.63.0",
    # CDP governance & discovery
    "cdpcurl>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
    "autopep8>=2.0.0",
    "behave>=1.2.6",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atelier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
