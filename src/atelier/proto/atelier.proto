syntax = "proto3";

package atelier;

// ── Health ────────────────────────────────────────────────────────

message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;
  string version = 2;
}

// ── Agents ────────────────────────────────────────────────────────

message AgentMetadata {
  string id = 1;
  string name = 2;
  string description = 3;
  string role = 4;
  repeated string tool_ids = 5;
}

message ListAgentsRequest {}

message ListAgentsResponse {
  repeated AgentMetadata agents = 1;
}

message GetAgentRequest {
  string id = 1;
}

message GetAgentResponse {
  AgentMetadata agent = 1;
}

// ── Data Sources ─────────────────────────────────────────────────

message DataSource {
  string id = 1;
  string source_type = 2;           // 'sample' | 'hive'
  string source_uri = 3;
  string display_name = 4;
  string vocabulary_mode = 5;       // 'universal' | 'hive'
  string created_at = 6;
  string metadata_json = 7;         // JSON
  bool is_archived = 8;
}

message ListDataSourcesRequest {
  bool include_archived = 1;       // default false = exclude archived
}

message ListDataSourcesResponse {
  repeated DataSource sources = 1;
}

// ── Classification Datasets ───────────────────────────────────────

message ClassificationDataset {
  string id = 1;
  string name = 2;
  string parquet_path = 3;
  string description = 4;
  int64 row_count = 5;
  string source_id = 6;
  int32 version_number = 7;
  bool is_active = 8;
  string summary = 9;
  string fsm_run_id = 10;
  string created_at = 11;
  bool is_archived = 12;
}

message ListDatasetsRequest {
  string source_id = 1;             // optional: filter by source
  bool include_archived = 2;        // default false = exclude archived
}

message ListDatasetsResponse {
  repeated ClassificationDataset datasets = 1;
}

// ── Classification FSM ───────────────────────────────────────────

message FSMStatusRequest {}

message FSMStatusResponse {
  string run_id = 1;
  string state = 2;
  string started_at = 3;
  string updated_at = 4;
  string progress_json = 5;
  string error = 6;
}

message StartClassificationRequest {
  string connection_name = 1;
  string database = 2;
  int32 sample_size = 3;
  reserved 4;
  reserved "use_mock";
  string source_id = 5;
}

message StartClassificationResponse {
  string run_id = 1;
  bool started = 2;
  string error = 3;
}

// ── Service ───────────────────────────────────────────────────────

service Atelier {
  rpc HealthCheck (HealthCheckRequest) returns (HealthCheckResponse) {}
  rpc ListAgents (ListAgentsRequest) returns (ListAgentsResponse) {}
  rpc GetAgent (GetAgentRequest) returns (GetAgentResponse) {}
  rpc ListDataSources (ListDataSourcesRequest) returns (ListDataSourcesResponse) {}
  rpc ListDatasets (ListDatasetsRequest) returns (ListDatasetsResponse) {}
  rpc GetFSMStatus (FSMStatusRequest) returns (FSMStatusResponse) {}
  rpc StartClassification (StartClassificationRequest) returns (StartClassificationResponse) {}
}
