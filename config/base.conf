# Atelier configuration
#
# Single source of truth for all application config.
# All code reads config exclusively through AtelierConfig (via load_config()).
# No module should access os.environ directly for config values.
# Environment variables are captured here via ${?VAR} substitution.
#
# Precedence: CLI args > env vars > these defaults.
#
# Copy .env.example to .env, uncomment and edit as needed.
# devenv shell loads .env automatically (dotenv.enable = true).

# ── Application Identity ──────────────────────────────────────────
#
# Display name surfaced in the React UI (Landing card title, browser
# tab, etc.).  Defaults to "Atelier" upstream.  Operators can override
# via ATELIER_APP_DISPLAY_NAME — set in the SOPS-encrypted dotenv
# (.env.cai.enc) for a lightweight rebrand on CAI deployments without
# patching source.

app {
  display_name = "Atelier"
  display_name = ${?ATELIER_APP_DISPLAY_NAME}
}

# ── gRPC Service ──────────────────────────────────────────────────

grpc {
  host = "0.0.0.0"
  host = ${?ATELIER_GRPC_HOST}
  port = 50051
  port = ${?ATELIER_GRPC_PORT}
  max_workers = 10
  max_workers = ${?ATELIER_GRPC_MAX_WORKERS}
}

# ── HTTP Gateway ──────────────────────────────────────────────────

gateway {
  host = "0.0.0.0"
  host = ${?ATELIER_GATEWAY_HOST}
  port = 8090
  port = ${?CDSW_APP_PORT}
}

# ── Claude Agent SDK ──────────────────────────────────────────────

agents {
  # ── Anthropic direct API ───────────────────────────────────────
  # Always available as overwatch / bootstrap capability.
  # Also serves as primary provider for Cloudera internal workloads
  # or production deployments that mandate direct API access.
  api_key = null
  api_key = ${?ANTHROPIC_API_KEY}

  # ── Model ──────────────────────────────────────────────────────
  # Standard model name for direct API; Bedrock inference profile
  # ARN for AWS. Each credential set uses its own model context.
  # Default tracks the latest Opus on Anthropic direct API. Bedrock
  # deployments override via ATELIER_AGENT_MODEL to pin the ARN of
  # whichever Opus generation Bedrock currently hosts — Bedrock lags
  # direct-API releases, so the two are not kept in lockstep.
  model = "claude-opus-4-7"
  model = ${?ATELIER_AGENT_MODEL}

  # ── AWS Bedrock ────────────────────────────────────────────────
  # Production default in CAI. Both Bedrock and direct API
  # credentials can coexist — workloads pick the right provider.
  aws_access_key_id = null
  aws_access_key_id = ${?AWS_ACCESS_KEY_ID}
  aws_secret_access_key = null
  aws_secret_access_key = ${?AWS_SECRET_ACCESS_KEY}
  aws_region = null
  aws_region = ${?AWS_REGION}
  aws_session_token = null
  aws_session_token = ${?AWS_SESSION_TOKEN}

  permission_mode = "dontAsk"
  permission_mode = ${?ATELIER_AGENT_PERMISSION_MODE}

  # ── Sub-model overrides (Bedrock / LiteLLM) ───────────────────
  # The claude CLI internally dispatches to haiku-sized and sonnet-sized
  # sub-models for tool search, summarization, and subagent tasks. Its
  # built-in defaults are direct-API model names that do NOT resolve to
  # Bedrock ARNs, so on Bedrock you MUST pin these or the CLI will fail
  # internal calls (often silently). Leave null on direct Anthropic.
  default_sonnet_model = null
  default_sonnet_model = ${?ANTHROPIC_DEFAULT_SONNET_MODEL}
  default_haiku_model = null
  default_haiku_model = ${?ANTHROPIC_DEFAULT_HAIKU_MODEL}
  subagent_model = null
  subagent_model = ${?CLAUDE_CODE_SUBAGENT_MODEL}

  # ── CLI feature flags ─────────────────────────────────────────
  # Experimental betas (e.g. tool-search) are direct-API-only. On the
  # Bedrock path _build_sdk_env applies safe defaults when these are
  # null; set them explicitly here (or via env) to override on either
  # provider. Expected values are "1"/"0" or "true"/"false" — whatever
  # the claude CLI understands.
  disable_experimental_betas = null
  disable_experimental_betas = ${?CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS}
  enable_tool_search = null
  enable_tool_search = ${?ENABLE_TOOL_SEARCH}
}

# ── Database ──────────────────────────────────────────────────────
#
# Local dev: devenv PostgreSQL on port 5533 (default below).
# CAI: bin/start-app.sh starts PGlite and exports ATELIER_DB_URL
#       before Python starts — no pgserver dependency needed.

db {
  url = "postgresql+psycopg://localhost:5533/atelier"
  url = ${?ATELIER_DB_URL}
}

# ── Qdrant Vector Store ──────────────────────────────────────────
#
# Local dev: devenv custom process (pkgs.qdrant)
# CAI: binary download from GitHub releases (RAG Studio pattern)

qdrant {
  host = "localhost"
  host = ${?QDRANT_HOST}
  http_port = 6333
  http_port = ${?QDRANT_PORT}
  grpc_port = 6334
  grpc_port = ${?QDRANT_GRPC_PORT}
}

# ── Classification Data ───────────────────────────────────────────

data {
  parquet_dir = "build/data"
  parquet_dir = ${?ATELIER_PARQUET_DIR}
}

# ── Classification Pipeline ──────────────────────────────────────

classify {
  # Hive connection for vocabulary + metadata
  connection_name = ""
  connection_name = ${?ATELIER_CLASSIFY_CONNECTION}
  database = "default"
  database = ${?ATELIER_CLASSIFY_DATABASE}

  # Optional curated-reference CSV — per-column expected codes used
  # for accuracy reporting in evaluation_report + overwatch.  Accepts
  # a path or file:// URI; relative paths resolve against the repo
  # root.  CSV schema (either form):
  #   column_name,code[,annotation]            (qualified names)
  #   table_name,column_name,code[,annotation]
  # Contents never committed — deployments supply their own file.
  reference_uri = ""
  reference_uri = ${?ATELIER_CLASSIFY_REFERENCE_URI}

  # Sampling
  sample_size = 50
  sample_size = ${?ATELIER_CLASSIFY_SAMPLE_SIZE}
  column_sample_limit = 1000
  column_sample_limit = ${?ATELIER_CLASSIFY_COLUMN_SAMPLE_LIMIT}
  tables_limit = 100
  tables_limit = ${?ATELIER_CLASSIFY_TABLES_LIMIT}

  # Reference-column exclusion — drop synth-generator answer-key
  # columns (name pattern
  # ``^(attr|code|col|data|field|item|key|ref|val|var)_\d+(_\d+)*$``)
  # before the LLM sweep.  Default ON; the regex doesn't match any
  # production column naming we've seen, so turning it off is a
  # no-op on real data.  Deliberately toggleable so UAT reviewers
  # can demonstrate that accuracy holds in both configurations.
  # This knob exists to deal with one specific UAT synth corpus and
  # is intended for deletion once that dataset is retired.
  # DISABLED: all columns are required for the current configuration.
  # The pipeline ignores this value; see src/atelier/classify/pipeline.py
  # and src/atelier/config.py for the inert-schema rationale.
  exclude_reference_columns = false
  exclude_reference_columns = ${?ATELIER_CLASSIFY_EXCLUDE_REFERENCE_COLUMNS}

  # Embedding model + acceleration
  embedding_model = "all-MiniLM-L6-v2"
  embedding_device = "auto"
  embedding_device = ${?ATELIER_EMBEDDING_DEVICE}
  embedding_batch_size = 32
  embedding_batch_size = ${?ATELIER_EMBEDDING_BATCH_SIZE}

  # ── GPU acceleration ──────────────────────────────────────────
  # Controls sharded embedding + custom SAGE/SHAP GPU kernels +
  # CatBoost GPU training.  "auto" (the default) uses all visible
  # CUDA devices when preflight_gpu() reports availability; falls
  # back to CPU otherwise.  Pin specific devices via CUDA_VISIBLE_DEVICES.
  gpu {
    enabled = "auto"                          # auto | true | false
    enabled = ${?ATELIER_GPU_ENABLED}
    # Below this many texts in a single encode call, skip fan-out —
    # single-device encoding is faster than coordinating threads.
    # Default is set high (200K) because MiniLM-L6 is small enough that
    # a single 4090 saturates at ~13K texts/s and the Python thread/GIL
    # coordination cost exceeds the multi-device gain below ~200K.  Drop
    # this if switching to a larger embedding model (BGE-large, etc).
    shard_threshold = 200000
    shard_threshold = ${?ATELIER_GPU_SHARD_THRESHOLD}
    # Permutations per minibatch in the GPU SAGE/SHAP kernel.  Bounds
    # per-chunk VRAM; tune down if OOM on small cards.
    sage_chunk_permutations = 16
    sage_chunk_permutations = ${?ATELIER_GPU_SAGE_CHUNK}
  }

  # FSM behavior — auto-start on gateway boot
  auto_start = false
  auto_start = ${?ATELIER_CLASSIFY_AUTO_START}

  # Default data source for auto-start. Empty = Sample (source_id ootb-sample).
  default_source = ""
  default_source = ${?ATELIER_DEFAULT_SOURCE}

  # ── Subagent model override ─────────────────────────────────────
  # Model used for classification subagent work (structured output).
  # Backend type is inferred from the model identifier format:
  #   - Bedrock ARN/ID (arn:... or us.anthropic.*) → invoke_model
  #   - Plain Anthropic ID (claude-sonnet-*) → direct Messages API
  # Required when no explicit ATELIER_LLM_* config is set.
  #
  # Two env vars resolve to the same setting.  Later wins per HOCON
  # semantics, so ATELIER_CLASSIFY_MODEL (the AMP-config-page-friendly
  # name that groups with other ATELIER_CLASSIFY_* controls) takes
  # precedence when both are set.  ANTHROPIC_SUBAGENT_MODEL is kept
  # so deployments provisioned before the rename continue to work.
  subagent_model = null
  subagent_model = ${?ANTHROPIC_SUBAGENT_MODEL}
  subagent_model = ${?ATELIER_CLASSIFY_MODEL}

  # ── ML Classifier model paths ──────────────────────────────────
  catboost_model_path = "build/models/catboost.cbm"
  catboost_model_path = ${?ATELIER_CATBOOST_MODEL_PATH}
  # SVM: no pre-trained path — per-vocab SVM is trained from enrichment
  # payloads during the pipeline run (_ensure_per_vocab_svm).

  # ── NHSVM (Choi et al. 2015) ─────────────────────────────────────
  # Normalized Hierarchical SVM reweighting at inference time.
  # Penalizes cross-subtree probability flow proportionally to
  # normalized tree distance — prevents shallow catch-alls (INOS)
  # from absorbing deep-subtree classifications.
  svm {
    hierarchical = true
    nhsvm_temperature = 1.0
    nhsvm_svd_components = 200
    nhsvm_svd_components = ${?ATELIER_SVM_NHSVM_SVD_COMPONENTS}
  }

  # ── LLM Backend (for bootstrap convergence loop) ────────────────
  # Default: openai_compatible for vLLM/GLM-4.7 on HGX.
  # Switch to "anthropic", "cerebras", or "bedrock".
  llm {
    backend = "openai_compatible"
    backend = ${?ATELIER_LLM_BACKEND}
    api_key = null
    api_key = ${?ATELIER_LLM_API_KEY}
    model = "glm-4.7"
    model = ${?ATELIER_LLM_MODEL}
    base_url = null
    base_url = ${?ATELIER_LLM_BASE_URL}
    max_tokens = 65536
    max_tokens = ${?ATELIER_LLM_MAX_TOKENS}
    temperature = 0.0
    # Reduced 50 → 25 on 2026-04-17 after UAT overwatch flagged
    # identity_data columns with missing LLM evidence.  At 50 cols /
    # call on a 220-term vocabulary, per-batch input approaches 60 kB
    # and the LLM silently drops trailing columns from the JSON
    # response when the response approaches max_tokens.  25 halves
    # batch tension with negligible throughput cost (Opus handles
    # either batch size in < 5 s on direct API).
    columns_per_call = 25
    columns_per_call = ${?ATELIER_LLM_COLUMNS_PER_CALL}
    # Floor for exhaustive halving retry.  A failing batch halves
    # recursively down to this size; 1 means per-column fallback with
    # individual failures recorded in state.batch_audit rather than
    # silently dropping 25 columns behind a single warning log.
    min_columns_per_call = 1
    min_columns_per_call = ${?ATELIER_LLM_MIN_COLUMNS_PER_CALL}
    max_retries = 3
    disable_reasoning = false
    disable_reasoning = ${?ATELIER_LLM_DISABLE_REASONING}
    # Chain-of-thought token budget.  0 = don't send the field; default
    # because plain OpenAI-compatible endpoints (e.g. stock GLM-4.7 on
    # vLLM) 422 on the unknown property.  Set >0 only for reasoning-aware
    # backends: Anthropic thinking, Cerebras reasoning models, reasoning-
    # enabled vLLM builds.
    reasoning_budget = 0
    reasoning_budget = ${?ATELIER_LLM_REASONING_BUDGET}
    discount = 0.15
  }

  # ── DST Fusion Strategy ─────────────────────────────────────────
  # "dempster" (default): Classical Dempster's rule with (1-K)
  #   normalization.  Under the fit_to_llm regime, CatBoost and LLM
  #   put mass on the same singleton by construction → Dempster's K
  #   drops significantly because the conflict pairs between those
  #   two strong sources are near-zero.  The residual K comes from
  #   cosine/SVM dispersal and is a bounded [0, 1] diagnostic.
  # "yager": Redirects conflict mass to Θ instead of normalizing.
  #   Produces identical top labels but widens belief intervals
  #   (honest ignorance) and reports conflict additively across
  #   sources (can exceed 1 — a diagnostic sum, not a probability).
  #   Flip via Settings when you specifically want the honest-
  #   ignorance view instead of the K signal.
  fusion_strategy = "dempster"
  fusion_strategy = ${?ATELIER_FUSION_STRATEGY}

  # ── SVM Evidence Source ─────────────────────────────────────────
  # Toggle for the per-vocab SVM trained at vocab-load time via the
  # ICE.*-to-user-taxonomy alignment.  Disabled 2026-05-13 after
  # c0ceaf5c showed the LLM-mediated alignment produces a degenerate
  # 3-class classifier (votes for 1.2.4 / 1.2.1 / 0.1 on every column;
  # inflated mean_conflict by 51% vs the 5-source baseline 5450b626).
  # Re-enable after the failure-mode-recipe synth training lands —
  # the plumbing (chunked alignment, caching, install, diagnostic) is
  # all in place; only the training distribution needs rebuilding.
  svm {
    enabled = false
    enabled = ${?ATELIER_CLASSIFY_SVM_ENABLED}
  }

  # ── Bootstrap Convergence ───────────────────────────────────────
  bootstrap {
    max_iterations = 5
    max_iterations = ${?ATELIER_BOOTSTRAP_MAX_ITERATIONS}
    # Floor on bootstrap iterations — see feedback_pipeline_invariants.md.
    # The pipeline is iterative by design; an early-exit on iteration 1
    # produces output the same size as a real run but hasn't exercised
    # the DST revisit loop.  Enforced as >=2 at pipeline entry.
    min_iterations = 2
    min_iterations = ${?ATELIER_BOOTSTRAP_MIN_ITERATIONS}
    k_threshold = 0.2
    k_threshold = ${?ATELIER_BOOTSTRAP_K_THRESHOLD}
    # Default 1.0 — every column is expected to receive a classification
    # at the current corpus scales (OOTB Sample 316 cols, Synthetic 9782
    # cols).  Relax toward 0.9x when we hit gittables-scale corpora where
    # the long tail of rare categories makes 100% coverage expensive.
    coverage_target = 1.0
    coverage_target = ${?ATELIER_BOOTSTRAP_COVERAGE_TARGET}
    max_total_llm_calls = 5000
    max_total_llm_calls = ${?ATELIER_BOOTSTRAP_MAX_TOTAL_LLM_CALLS}
    # Attempts ceiling — counts every entry into the halving-retry
    # function (success, failure, halved retry, truncated).  A failing
    # endpoint never increments max_total_llm_calls, so on its own that
    # cap provides no brake on a retry storm; this is the gate that
    # catches it.  Default 2× calls keeps healthy sweeps from tripping.
    max_total_llm_attempts = 10000
    max_total_llm_attempts = ${?ATELIER_BOOTSTRAP_MAX_TOTAL_LLM_ATTEMPTS}
    # Wall-clock LLM-sweep deadline (seconds).  ``0`` disables the
    # brake (default) — attempts cap + consecutive-failure breaker
    # cover the dead-endpoint case, and a healthy-but-slow sweep
    # (large vocab + Bedrock latency) shouldn't be guillotined by a
    # fixed clock.  Set a positive value to re-enable as a hard
    # ceiling; overrun raises SweepDeadlineError and routes the FSM
    # to ERROR with a clear reason.
    sweep_deadline_s = 0.0
    sweep_deadline_s = ${?ATELIER_BOOTSTRAP_SWEEP_DEADLINE_S}
    # Halving-retry circuit breaker.  After this many consecutive
    # recoverable failures with no successful response, abort the sweep
    # — the endpoint is effectively dead and each further retry just
    # compounds the outage.  Trips at ~2 min of wall-clock on a 15s
    # connect-timeout; attempts cap / deadline are the slower backstops.
    max_consecutive_halve_failures = 8
    max_consecutive_halve_failures = ${?ATELIER_BOOTSTRAP_MAX_CONSECUTIVE_HALVE_FAILURES}
    # Belief-gap convergence (primary convergence criteria).
    #
    # Calibration recalibrated 2026-05-03 for the parents-as-first-class-
    # tagging regime (commits aea4bcc/ef81f0d/b927be5).  The frame now
    # carries internal-node focal elements alongside leaf singletons, so
    # for any leaf L in subtree A the parent's mass m(A) contributes to
    # Pl(L) but not Bel(L) — leaf intervals widen by m(parent) compared
    # to the leaf-only frame they were originally tuned against.  The
    # cbbac8a5 run on the 691-column impala-poc/reference_corpus corpus
    # plateaued at mean_gap ≈ 0.174 with the old 0.15 target and burned
    # all 8 iterations without converging — gap_threshold 0.18 catches
    # that plateau by iteration 4 with no measurable accuracy delta.
    # Operators who want tighter intervals can still dial down via the
    # Settings page.
    gap_threshold = 0.18         # mean(Pl - Bel) target  [was 0.15 (leaf-only)]
    gap_threshold = ${?ATELIER_BOOTSTRAP_GAP_THRESHOLD}
    # Was 0.10 (phase-gate-1), raised to 0.20 on 2026-04-17 (aggressive
    # re-sweep is the cheapest accuracy lever), and now 0.25 under
    # parent-aware fusion which mechanically inflates the per-column
    # gap.  Hits the SETTINGS_METADATA ceiling — bumped that to 0.30
    # for operator headroom on stubborn corpora.
    clarity_target = 0.25        # max fraction of unclear columns  [was 0.20 (leaf-only)]
    clarity_target = ${?ATELIER_BOOTSTRAP_CLARITY_TARGET}
    # Was 0.50; relaxed to 0.45 alongside gap_threshold for the same
    # reason: parent-aware fusion redistributes mass from a single leaf
    # singleton onto {parent ∪ leaf} focal elements, so leaf-level Bel
    # drops without the prediction itself getting weaker.  The 105
    # columns at Bel ∈ [0.45, 0.50) on cbbac8a5 are otherwise-settled
    # parent-tagged columns the old floor was incorrectly flagging.
    bel_floor = 0.45             # min belief for a column to be "settled"  [was 0.50 (leaf-only)]
    bel_floor = ${?ATELIER_BOOTSTRAP_BEL_FLOOR}
    # Independent-tier consensus mass required to trigger an LLM
    # revisit on cosine/pattern/name_match disagreement with LLM.
    # Pegged at 0.45 so diffuse cosine signal alone cannot fire the
    # gate — the indep tier must place meaningful mass on a single
    # code before the disagreement is acted on.  See Shafer 1976
    # §11.3 and docs/src/architecture/dst-evidence-independence.md.
    indep_revisit_mass_threshold = 0.45
    indep_revisit_mass_threshold = ${?ATELIER_BOOTSTRAP_INDEP_REVISIT_MASS_THRESHOLD}

    # Rank-instability gate (DST sensitivity study Rec 3, 2026-05-16).
    # When the gap between the top-1 and top-2 predicted code's
    # belief is below this floor, the column joins the revisit list
    # independently of gap_threshold / bel_floor — captures unstable
    # rankings that the wider gates miss.  Default 0.05; raise to
    # widen the revisit net for noisy fusion regimes.  See
    # docs/notes/2026-05-16/dst-sensitivity-findings.md.
    top1_margin_threshold = 0.05
    top1_margin_threshold = ${?ATELIER_BOOTSTRAP_TOP1_MARGIN_THRESHOLD}
  }

  # ── Cautious-code review — PROVEN HARMFUL ─────────────────────
  # Empirically validated against run ce4f3777 (2026-05-20, 920 ref
  # columns): reroute = 76.1% miss rate, backoff = 78.8% miss rate,
  # net accuracy destruction = −13.6pp vs LLM-only.  The cascade:
  # degraded evidence → high K → low belief → mass review → mass
  # damage.  Default OFF + bel_threshold 0.0 (unreachable).
  #
  # DO NOT re-enable without a validated fix for the fundamental
  # problem (a second LLM call on high-conflict evidence introduces
  # more error than it corrects).  All prior remediations (R2a
  # stability guard, R2c shortlist-permissive, R3 opaque-sibling
  # exclusion) failed to overcome this.
  cautious_review {
    enabled = false
    enabled = ${?ATELIER_CLASSIFY_CAUTIOUS_REVIEW_ENABLED}
    # Belief threshold below which the deeper predicted_code triggers
    # review.  Set to 0.0 (unreachable) as a belt-and-suspenders
    # guard — even if enabled is flipped to true, no column will have
    # belief < 0.0.  Override ONLY for controlled re-validation
    # experiments; see cautious_review.py docstring for the evidence.
    bel_threshold = 0.0
    bel_threshold = ${?ATELIER_CLASSIFY_CAUTIOUS_REVIEW_BEL_THRESHOLD}
    # default | anthropic_direct | bedrock — chooses the LLM provider
    # for the review.  ``default`` follows whatever classify uses
    # (Bedrock when classify_subagent_model is an ARN); set
    # ``anthropic_direct`` when you want Opus 4.7 reasoning-budget
    # access (requires ANTHROPIC_API_KEY).
    backend = "default"
    backend = ${?ATELIER_CLASSIFY_CAUTIOUS_REVIEW_BACKEND}
    # ── audit_2026-05-06_a remediations (each independently flagged) ─
    # R2c: when the LLM picks a code outside the cross_subtree_belief
    # shortlist but inside the runtime taxonomy, accept it.  Closes
    # 8/11 errored decisions in 8d67b1ed (LLM picks valid codes the
    # shortlist's 5-entry budget missed).
    shortlist_permissive = true
    shortlist_permissive = ${?ATELIER_CLASSIFY_CAUTIOUS_REVIEW_SHORTLIST_PERMISSIVE}
    # R3: drop opaque-named siblings (col_NN, var_NN, dim_NN, …) from
    # the reviewer's prompt context.  Breaks the col_04 sibling-
    # context-poisoning class.
    exclude_opaque_siblings = true
    exclude_opaque_siblings = ${?ATELIER_CLASSIFY_CAUTIOUS_REVIEW_EXCLUDE_OPAQUE_SIBLINGS}
    # R2a: reject reroute when fusion + LLM already converged with
    # high confidence.  Prevents gaming_profiles.handle-class flips
    # where a non-deterministic LLM swing pushes the reviewer off a
    # well-supported prediction.
    stability_guard_enabled = true
    stability_guard_enabled = ${?ATELIER_CLASSIFY_CAUTIOUS_REVIEW_STABILITY_GUARD_ENABLED}
    stability_guard_llm_conf = 0.80
    stability_guard_llm_conf = ${?ATELIER_CLASSIFY_CAUTIOUS_REVIEW_STABILITY_GUARD_LLM_CONF}
  }

  # R1: annotation-mnemonic fallback when the LLM emits a mnemonic
  # like ``SSN``, ``EMAIL``, ``NAMEFULL`` instead of the numeric dot-
  # code.  Strictly recovers evidence — leave on for production.
  resolve_llm_annotation_mnemonic = true
  resolve_llm_annotation_mnemonic = ${?ATELIER_CLASSIFY_RESOLVE_LLM_ANNOTATION_MNEMONIC}

  # R6: skip Hive/Hue temp tables (``__tmp_*`` prefix) at discovery.
  exclude_temp_tables = true
  exclude_temp_tables = ${?ATELIER_CLASSIFY_EXCLUDE_TEMP_TABLES}

  # Per-run table denylist for the extend-classification workflow.
  # Comma-separated regex patterns matched against table names
  # (case-sensitive, ``re.search`` semantics).  Tables whose name
  # matches ANY pattern are dropped at discovery time and never
  # sampled — applies uniformly to classify and extend pipelines.
  #
  # Workflow:
  #   1. Before the parent classify run, set patterns covering the
  #      newly-added tables so they're absent from the parent dataset.
  #   2. Before the extend run, clear the entry.  Extend re-discovers
  #      the full source and tags everything (parent + new) using the
  #      parent's CatBoost model — no extra LLM cost.
  # The 20 tables added to hive-poc/reference_corpus after the
  # 5450b626 baseline.  Restored 2026-05-13 ahead of a fresh
  # classify run that exercises the LLM-emission-validation +
  # retry logic added in this session (catches the ``A_FD``-class
  # hallucinations at source so CatBoost trains on a clean class
  # space).  Clear this entry again before the extend run that
  # follows.
  table_exclude_patterns = ""
  table_exclude_patterns = ${?ATELIER_CLASSIFY_TABLE_EXCLUDE_PATTERNS}

  # ── DST Discount Factors ──────────────────────────────────────
  # Each evidence source allocates a fraction of mass to Theta
  # (total ignorance). Higher discount = more conservative.
  #
  # Calibration follows Shafer 1976 §11.3 (reliability discount α =
  # 1 - discount applied to source mass) with the additional
  # adjustment for non-distinct evidence per Denoeux 2008: when a
  # source rides on labels deterministically derived from another
  # source (CatBoost fit-to-LLM — see
  # ml_train.fit_catboost_to_llm_labels), Dempster's rule
  # double-counts overlap and an undiscounted derivative source
  # mathematically swallows the only genuinely independent signal
  # (cosine).  catboost_base / catboost_fallback are therefore pinned
  # well above the cosine discount.
  #
  # ``svm`` is a special case as of 2026-05-04: the synth-trained
  # SVM operates on TF-IDF features and labels from the bundled-
  # ontology synth generators, then translates predictions into the
  # user taxonomy via the LLM-mediated alignment in
  # ``ontology_alignment.py``.  The alignment is a per-vocabulary
  # mapping table — vocabulary-level shared error with the runtime
  # LLM, NOT per-column shared labels (which the excised M9
  # SVM-on-LLM-labels retrain induced and which justified the prior
  # 0.55 calibration).
  # SVM discount: 0.22 reflects the subsumption-prediction alignment
  # regime — the SVM's alignment is now computed via sentence-transformer
  # cosine similarity (structurally independent of runtime LLM), with
  # weak non-distinctness only via the shared enrichment-LLM upstream
  # (same structural dependency as the late-interaction cosine source).
  # See ``ontology_alignment.py`` module docstring for the full
  # independence argument.  Prior LLM-mediated alignment used 0.30.
  # See docs/src/architecture/dst-evidence-independence.md.
  discounts {
    cosine = 0.20
    svm = 0.22                    # subsumption-prediction alignment (enrichment-mediated)
    pattern_theta = 0.25
    name_match_exact = 0.70       # singleton mass for exact label match
    name_match_code = 0.50        # formal code / abbrev match
    name_match_alias = 0.50       # common name alias match
    name_match_overlap = 0.30     # word overlap match
    catboost_base = 0.55          # raised; CatBoost is fit-to-LLM
    catboost_variance_scale = 1.6 # multiplier for virtual ensemble variance
    catboost_max = 0.75           # cap on adaptive discount
    catboost_fallback = 0.55      # when no variance available
    confusable_ratio_threshold = 3.0
  }

  # ── Late-Interaction Multi-Vector Cosine via Qdrant ──────────
  # The production cosine evidence source under the DST-independence
  # architecture.  Default ON: the late-interaction multi-vector path
  # is what restores discriminative signal on adversarial corpora and
  # restores independence among evidence sources.  Setting this to
  # false explicitly routes the pipeline back through the single-
  # vector cosine path that is known to under-discriminate — that
  # disable is for emergency rollback only, not a normal operating
  # mode.
  #
  # When this flag is true and the late-interaction path cannot run
  # (no enriched collection registered, Qdrant unreachable,
  # qdrant-client missing), the pipeline logs a WARNING and marks the
  # run as degraded.  Operators should investigate and restore the
  # late-interaction path rather than leaving the pipeline in the
  # degraded mode.
  #
  # See docs/src/architecture/late-interaction-cosine.md.
  cosine {
    late_interaction {
      enabled = true
      enabled = ${?ATELIER_CLASSIFY_COSINE_LATE_INTERACTION}

      # ColBERT model for token-level late-interaction embeddings.
      # Both entity and annotation sides use the same model; Qdrant's
      # native MaxSim handles the token-level cross-alignment.
      model = "colbert-ir/colbertv2.0"
      model = ${?ATELIER_COLBERT_MODEL}

      # Qdrant URL is normally resolved via the taxonomy_registry row
      # (set at enrichment time); this is the fallback when the
      # registry row's qdrant_url is null.
      qdrant_url = "http://127.0.0.1:6333"
      qdrant_url = ${?ATELIER_QDRANT_URL}
    }
  }

  # ── Subsumption Alignment ─────────────────────────────────────
  # Controls the ICE.* → user-vocab mapping used to train the
  # per-vocabulary SVM.  Uses sentence-transformer cosine similarity
  # between ICE concept signatures and enriched annotation payloads
  # from the taxonomy_registry's Qdrant collection.
  #
  # See ``subsumption_alignment.py`` and ``ontology_alignment.py``.
  subsumption_alignment {
    # Minimum cosine similarity for an ICE → user mapping.  Lower
    # values produce more mappings but risk false alignments; higher
    # values produce fewer (but more confident) mappings.
    score_threshold = 0.35
    score_threshold = ${?ATELIER_SUBSUMPTION_SCORE_THRESHOLD}
  }

  # ── SHAP Explanations ─────────────────────────────────────────
  shap {
    enabled = true
    enabled = ${?ATELIER_SHAP_ENABLED}
    top_k = 3
    # Method selection.  Choices: "auto" | "permutation" | "treeshap".
    # ``auto`` prefers GPU PermutationSHAP over the 12 named features
    # (interpretable + fast on GPU); skips entirely on CPU rather
    # than blocking on a slow run or producing the aggregate-
    # "embedding" attribution that TreeSHAP emits today.
    # ``permutation`` forces PermutationSHAP regardless of hardware.
    # ``treeshap`` forces CatBoost TreeSHAP — operators who accept
    # the aggregate-embedding interpretation can opt in for speed.
    method = "auto"
    method = ${?ATELIER_CLASSIFY_SHAP_METHOD}
  }

  # ── Taxonomy validation ───────────────────────────────────────
  # validate_taxonomy() runs at LOADING_VOCAB and surfaces
  # post-normalization label collisions, duplicate codes, and
  # orphaned aliases as warnings.  Structural errors (duplicate
  # codes) always abort.  Strict mode aborts on warnings too — use
  # for vocabulary-team CI runs where any quality issue should
  # break the build.
  taxonomy {
    strict_validation = false
    strict_validation = ${?ATELIER_CLASSIFY_TAXONOMY_STRICT_VALIDATION}
  }

  # ── Pre-LLM phase observability (proof-of-progress) ───────────
  # Lightweight probes with short hard timeouts catch dead Hive
  # connections fast (fail-fast on broken setups).  Heavy queries
  # themselves run unbounded but observable via phase_heartbeat —
  # nautilus's stall_threshold_s is the abort signal once
  # FSM.updated_at stops advancing, NOT a fixed wall-clock.
  liveness_probe_timeout_s = 5.0
  liveness_probe_timeout_s = ${?ATELIER_CLASSIFY_LIVENESS_PROBE_TIMEOUT_S}
  metadata_probe_timeout_s = 10.0
  metadata_probe_timeout_s = ${?ATELIER_CLASSIFY_METADATA_PROBE_TIMEOUT_S}
  phase_heartbeat_interval_s = 5.0
  phase_heartbeat_interval_s = ${?ATELIER_CLASSIFY_PHASE_HEARTBEAT_INTERVAL_S}

  # ── CatBoost Training Hyperparameters ──────────────────────────
  # Hyperparameters for CatBoost training (see ml_train.train_catboost).
  # Expose via Settings page so operators can tune without editing code.
  catboost {
    iterations = 1000
    iterations = ${?ATELIER_CATBOOST_ITERATIONS}
    depth = 6
    depth = ${?ATELIER_CATBOOST_DEPTH}
    learning_rate = 0.10
    learning_rate = ${?ATELIER_CATBOOST_LEARNING_RATE}
    # Fit-to-LLM mode — when true AND the LLM sweep has produced
    # enough labels on this run, an in-memory CatBoost is trained on
    # (embedding_text, llm_code) pairs and replaces the pre-trained
    # model on disk for the rest of the pipeline.  The SHAP/SAGE tour
    # then attributes feature contributions to the model that
    # actually agrees with the LLM — which is the transparent
    # "why this code" story we want explained to the operator.
    # Default true on 2026-04-17: fit-to-LLM is the transparency
    # engine.  CatBoost trains on the current run's LLM labels, SHAP
    # and SAGE then attribute to a model that actually agrees with the
    # LLM — the explainability value prop.  No cost downside when the
    # run has >= fit_to_llm_min_labels LLM labels; auto-defers
    # otherwise.  Set false to freeze CatBoost to the pre-trained
    # model path.
    fit_to_llm = true
    fit_to_llm = ${?ATELIER_CATBOOST_FIT_TO_LLM}
    fit_to_llm_min_labels = 30
    fit_to_llm_min_labels = ${?ATELIER_CATBOOST_FIT_TO_LLM_MIN_LABELS}
  }

  # ── SAGE Feature Importance ────────────────────────────────────
  # SAGE is a critical pipeline component — it quantifies which evidence
  # sources (name match, pattern, cosine, LLM, etc.) actually drive
  # classification decisions. The flag gates runtime cost (~30-60s on GPU,
  # minutes on CPU) for development and interactive UI testing, NOT because
  # SAGE is optional. Production runs should always enable it.
  sage {
    enabled = false
    enabled = ${?ATELIER_SAGE_ENABLED}
    permutations = 512
    permutations = ${?ATELIER_SAGE_PERMUTATIONS}
  }

  # ── Monte Carlo Sampling ──────────────────────────────────────
  # Activates automatically when corpus exceeds min_corpus_size.
  # Below that threshold, every column is directly LLM-classified.
  monte_carlo {
    min_corpus_size = 200
    min_corpus_size = ${?ATELIER_MC_MIN_CORPUS_SIZE}
    # Raised 0.15 → 1.00 on 2026-04-17: full LLM coverage is the
    # thesis default — every column reaches the LLM, CatBoost learns
    # to agree with it, SHAP/SAGE explain why.  Validated on the
    # meta-tagging source (97.8% fused accuracy vs 93.0% third-party
    # LLM baseline).  Operators with tight LLM budgets can scale down
    # via the Sampling tab; MC stratification re-activates at any
    # sample_fraction < 1.0.
    sample_fraction = 1.00
    sample_fraction = ${?ATELIER_MC_SAMPLE_FRACTION}
    min_per_stratum = 3
    max_sampled_columns = 500
    max_sampled_columns = ${?ATELIER_MC_MAX_SAMPLED}
    # Lowered 0.85 → 0.80 on 2026-05-03 alongside the convergence-loop
    # bel_floor: under parent-aware fusion the same propagation-worthy
    # directly-classified label measures Bel ~0.80 instead of ~0.85
    # because mass is shared between the leaf singleton and its parent
    # focal element.  The 0.30 propagation discount still keeps
    # propagated rows visibly weaker than directly-evaluated ones.
    propagation_threshold = 0.80
    propagation_threshold = ${?ATELIER_MC_PROPAGATION_THRESHOLD}
    propagation_discount = 0.30
  }

  # ── Row-Level Monte Carlo ──────────────────────────────────
  # When enabled, rotates row subsets across bootstrap iterations
  # to expose diverse value evidence. Zero-cost when disabled.
  row_mc {
    enabled = false
    enabled = ${?ATELIER_ROW_MC_ENABLED}
    k = 10                           # Values per iteration (up from default 5)
    k = ${?ATELIER_ROW_MC_K}
    strategy = "stratified"          # head | stratified | random
    strategy = ${?ATELIER_ROW_MC_STRATEGY}
    iterations = 3                   # Row-sample iterations per column
    iterations = ${?ATELIER_ROW_MC_ITERATIONS}
    max_iterations = 5               # Safety cap
    adaptive_escalation = true       # Escalate row-unstable columns to full reservoir
    adaptive_escalation = ${?ATELIER_ROW_MC_ADAPTIVE}
  }

  # ── Background Feature Analysis ──────────────────────────────
  # When true, SHAP runs in a background thread while the pipeline
  # proceeds to EVALUATING. Disable on CAI if background threads
  # cause issues with the runtime environment.
  background_analysis = true
  background_analysis = ${?ATELIER_BACKGROUND_ANALYSIS}

  # ── Agent-Driven Convergence ──────────────────────────────────
  # When enabled, the convergence loop is driven by a Claude agent
  # that reasons about DST conflict and decides which columns to
  # revisit. When disabled, the programmatic bootstrap loop runs.
  agent {
    enabled = false
    enabled = ${?ATELIER_CLASSIFY_AGENT_ENABLED}
    max_turns = 10
    max_turns = ${?ATELIER_CLASSIFY_AGENT_MAX_TURNS}
    # Model for agent reasoning (falls back to agents.model)
    model = null
    model = ${?ATELIER_CLASSIFY_AGENT_MODEL}
  }

  # ── Per-iteration scoring against the Opus-crafted reference ─
  #
  # When agent_mediated_path is set, the pipeline scores state.labels
  # against the agent-mediated reference after each bootstrap iteration
  # and writes scoring_trend.json + per-iteration scoring_errors_iter{N}.tsv
  # under build/results/{run_id}/.  The trend covers strict accuracy,
  # hierarchy-aware accuracy (depth-3 prefix), per-mode failure counts,
  # belief diagnostics, and disk headroom.
  #
  # Failure semantics: this is a *tuning* scaffold (operators use it to
  # adjust bel_threshold, gap_threshold, and any other parameter that
  # touches the bootstrap), so misconfiguration is more expensive than
  # a hard error.  When enabled=true and agent_mediated_path is set, the
  # pipeline fails fast on missing file, format errors, or vocabulary
  # mismatch — before LLM_SWEEP begins.
  #
  # Leaving agent_mediated_path empty disables incremental scoring with
  # a single startup log line; production runs that have no reference
  # to score against pay zero cost.
  evaluation {
    agent_mediated_path = "build/data/agent_mediated/agent_mediated.json"
    agent_mediated_path = ${?ATELIER_AGENT_MEDIATED_PATH}
    enabled = true
    enabled = ${?ATELIER_CLASSIFY_EVALUATION_ENABLED}
  }

  # ── Disk-space guard ────────────────────────────────────────
  #
  # Pre-flight estimator: scans build/results/ for completed runs,
  # computes mean+2σ of their on-disk sizes, multiplies by
  # headroom_multiplier, and refuses to start a new run (or continue
  # past an iteration) when projected free space falls short.  Runs
  # at run start AND between bootstrap iterations.
  #
  # When fewer than min_runs_for_stats completed runs are visible the
  # guard falls back to bootstrap_floor_bytes; this prevents a fresh
  # build/results/ directory from waving every run through.
  disk_guard {
    enabled = true
    enabled = ${?ATELIER_CLASSIFY_DISK_GUARD_ENABLED}
    headroom_multiplier = 1.25
    headroom_multiplier = ${?ATELIER_CLASSIFY_DISK_GUARD_HEADROOM_MULTIPLIER}
    bootstrap_floor_bytes = 209715200  # 200 MiB
    bootstrap_floor_bytes = ${?ATELIER_CLASSIFY_DISK_GUARD_FLOOR_BYTES}
    min_runs_for_stats = 3
    min_runs_for_stats = ${?ATELIER_CLASSIFY_DISK_GUARD_MIN_RUNS}
  }
}

# ── CML Integration ──────────────────────────────────────────────

cml {
  project_id = null
  project_id = ${?CDSW_PROJECT_ID}
  domain = null
  domain = ${?CDSW_DOMAIN}
  engine_id = null
  engine_id = ${?CDSW_ENGINE_ID}

  # ── CAI Data Platform connections ─────────────────────────────
  # Comma-separated list of connection names registered in the CAI
  # workspace Data Connections UI. The Status page exposes these in
  # a dropdown so operators can run ad-hoc connectivity tests via
  # cml.data_v1. Example:
  #   data_connections = "default-impala,prod-hive,dev-virtual-warehouse"
  data_connections = ""
  data_connections = ${?ATELIER_DATA_CONNECTIONS}
}

# ── Governance (Atlas + Ranger) ────────────────────────────────────
# CDP Data Catalog / Apache Atlas / Apache Ranger integration.
# Credentials should be encrypted in .env.cai.enc via SOPS+age.

governance {
  # Atlas v2 REST API
  atlas {
    url = ""
    url = ${?ATELIER_ATLAS_URL}
    username = "admin"
    username = ${?ATELIER_ATLAS_USER}
    password = ""
    password = ${?ATELIER_ATLAS_PASSWORD}
  }

  # Ranger v2 REST API
  ranger {
    url = ""
    url = ${?ATELIER_RANGER_URL}
    username = "admin"
    username = ${?ATELIER_RANGER_USER}
    password = ""
    password = ${?ATELIER_RANGER_PASSWORD}
  }

  # Shared settings
  cluster_name = "cm"
  cluster_name = ${?ATELIER_CLUSTER_NAME}
  verify_ssl = false
  verify_ssl = ${?ATELIER_GOVERNANCE_VERIFY_SSL}

  # Auto-sync: push taxonomy + tag entities after each pipeline run
  auto_sync = false
  auto_sync = ${?ATELIER_GOVERNANCE_AUTO_SYNC}

  # Dry run: preview changes without writing to Atlas/Ranger
  dry_run = false
  dry_run = ${?ATELIER_GOVERNANCE_DRY_RUN}
}

# ── Overwatch ──────────────────────────────────────────────────────
# Autonomous pipeline monitoring + code evolution via Claude Opus.
# REQUIRES direct Anthropic API access (not Bedrock). When enabled,
# a dedicated Agent SDK instance monitors classification runs and can
# propose code improvements via GitHub App PRs.
#
# Default is "on" — the feature auto-activates when ANTHROPIC_API_KEY
# is set (see has_overwatch in config.py, which gates on credentials).
# Bedrock-only deployments never activate it. Admins can opt out by
# setting ATELIER_OVERWATCH_ENABLED=false.

overwatch {
  enabled = true
  enabled = ${?ATELIER_OVERWATCH_ENABLED}

  # Autonomy: "monitor" (observe only) | "propose" (create PRs) |
  #           "autonomous" (create + merge — future, not yet implemented)
  autonomy = "propose"
  autonomy = ${?ATELIER_OVERWATCH_AUTONOMY}

  # Note: overwatch.model has been retired.  Overwatch now follows
  # the Web Terminal Agent's selected model (see /api/terminal/models)
  # so the operator has a single, intuitive knob for both surfaces.
  # ATELIER_OVERWATCH_MODEL is no longer read.

  # GitHub App credentials for PR creation (propose/autonomous modes)
  github_app_id = ""
  github_app_id = ${?ATELIER_GITHUB_APP_ID}
  github_private_key_path = ""
  github_private_key_path = ${?ATELIER_GITHUB_PRIVATE_KEY_PATH}
  github_repo = ""
  github_repo = ${?ATELIER_GITHUB_REPO}

  # ── Nautilus: mid-run watcher ────────────────────────────────
  # Polls the FSM + BootstrapState.batch_audit between LLM calls;
  # fires an intervention record when the run stalls, the LLM
  # sweep runs long, or batch failures accumulate.  Cooperative
  # cancellation only — pipeline polls state.cancelled between
  # batches, never SIGKILL.
  nautilus {
    enabled = true
    enabled = ${?ATELIER_OVERWATCH_NAUTILUS_ENABLED}
    poll_interval_s = 10.0
    poll_interval_s = ${?ATELIER_OVERWATCH_NAUTILUS_POLL_INTERVAL_S}
    stall_threshold_s = 120.0
    stall_threshold_s = ${?ATELIER_OVERWATCH_NAUTILUS_STALL_THRESHOLD_S}
    llm_sweep_threshold_s = 300.0
    llm_sweep_threshold_s = ${?ATELIER_OVERWATCH_NAUTILUS_LLM_SWEEP_THRESHOLD_S}
    failed_batch_threshold = 10
    failed_batch_threshold = ${?ATELIER_OVERWATCH_NAUTILUS_FAILED_BATCH_THRESHOLD}
  }
}

# ── Annotation Enrichment ─────────────────────────────────────────
# LLM-mediated annotation enrichment for the late-interaction cosine
# architecture.  Generates the six-field structured payload per
# taxonomy node (prototype_values, value_patterns, name_hints,
# anti_examples, parent_path, ...) that populates the multi-vector
# Qdrant collection.
#
# Provider co-location: enrichment uses the SAME backend as the
# classification path (classify.llm.backend).  Within that backend,
# the strongest reasoning model available is selected — this keeps
# provider+credential management to a single operator knob.
#
# Bedrock deployments MUST set ATELIER_ENRICHMENT_MODEL to a valid
# inference-profile ARN — no portable default exists across
# accounts/regions, and silently degrading to a weaker model on
# Bedrock would contradict the "strongest reasoning model available"
# discipline.  The resolver in atelier.enrichment raises with a
# remediation hint if Bedrock is selected without an override.

enrichment {
  # Explicit model override.  When set, used verbatim regardless of
  # backend.  When null, the resolver derives the apex reasoning
  # model from cfg.classify_llm_backend:
  #   anthropic         → claude-opus-4-7 (apex on direct API)
  #   bedrock           → ERROR — operator must supply an ARN
  #   openai_compatible → cfg.classify_llm_model (operator-controlled endpoint)
  #   cerebras          → cfg.classify_llm_model (operator-controlled endpoint)
  model_override = null
  model_override = ${?ATELIER_ENRICHMENT_MODEL}

  # Extended-thinking token budget for the enrichment call.  Default
  # 16384 — enrichment is single-shot per taxonomy node, so we can
  # afford generous reasoning depth (the model is judging structural
  # overlap with sibling tags, prototype-value distributions, regex
  # constraints).  Honored by reasoning-aware backends (anthropic,
  # bedrock claude-4 family); silently ignored by others.
  reasoning_budget = 16384
  reasoning_budget = ${?ATELIER_ENRICHMENT_REASONING_BUDGET}

  # Max output tokens per generation.  The six-field payload with
  # prototype lists and anti-examples typically fits in 4-6K; 8192
  # gives headroom without inviting filler.
  max_tokens = 8192
  max_tokens = ${?ATELIER_ENRICHMENT_MAX_TOKENS}

  # Verifier-driven retry ceiling.  A generation that fails the
  # deterministic verifier suite (regex compile, prototype/pattern
  # consistency, parent-path match, etc.) is re-prompted with the
  # verifier feedback up to this many times.  Beyond the ceiling the
  # tag is recorded with its last attempt + verifier_pass_rate < 1,
  # never silently dropped — downstream late_interaction_to_mass
  # attenuates per-tag reliability by verifier_pass_rate.
  max_attempts = 3
  max_attempts = ${?ATELIER_ENRICHMENT_MAX_ATTEMPTS}

  # Temperature for generation.  Default 0.0 — enrichment outputs
  # are structured artifacts intended to be reproducible across runs
  # of the same (backend, model, prompt, source) tuple.  Non-zero
  # values defeat content-addressed caching and are surfaced as a
  # warning by the writer.
  temperature = 0.0
  temperature = ${?ATELIER_ENRICHMENT_TEMPERATURE}
}
