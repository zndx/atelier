name: Deploy mdbook docs

# Opt in to the Node 24 runtime for JavaScript actions. GitHub will
# force this default on 2026-06-02 and remove Node 20 on 2026-09-16;
# enabling it now clears the deprecation annotation for the
# actions/checkout and actions/upload-pages-artifact steps used below,
# regardless of whether each action has shipped a Node-24-native
# release yet.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [trunk]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.2/mdbook-v0.5.2-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C /usr/local/bin

      - name: Install d2
        run: |
          curl -sSL https://github.com/terrastruct/d2/releases/download/v0.7.1/d2-v0.7.1-linux-amd64.tar.gz \
            | tar xz -C /tmp
          cp /tmp/d2-v0.7.1/bin/d2 /usr/local/bin/

      - name: Install mdbook-d2
        run: |
          curl -sSL https://github.com/danieleades/mdbook-d2/releases/download/v0.3.8/mdbook-d2-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C /usr/local/bin

      - name: Build docs
        run: mdbook build docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
